# Booth CI — the Go module under booth/ (monorepo, board decision #7).
#
# The Booth is a separate Go module from the operator (app/), so it gets its own
# build/test/coverage/quality pipeline rather than being bolted onto ci.yml.
# It now holds BOTH Phase-3 halves in one module: P3-2 (ISI-7150) auth/ AuthN
# provider and P3-1 (ISI-7149) the §6.3 authz API (internal/{authz,store,server,
# audit} + cmd/booth).
#
# Path-filtered to booth/** plus app/api/** — the Booth consumes the operator's
# CRD types via `replace => ../app`, so a change to those API types can break the
# Booth build. This is a standalone check, not part of the operator's
# `ci-required` aggregate.
name: booth-ci

on:
  push:
    branches: [main]
    paths: ['booth/**', 'app/api/**', '.github/workflows/booth-ci.yml']
  pull_request:
    paths: ['booth/**', 'app/api/**', '.github/workflows/booth-ci.yml']

permissions:
  contents: read

concurrency:
  group: booth-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: booth

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: booth/go.mod
          cache-dependency-path: booth/go.sum
      - name: Build
        run: go build ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: booth/go.mod
          cache-dependency-path: booth/go.sum
      - name: Run tests
        run: go test -race -coverprofile=cover.out ./...
      - name: Enforce 80% coverage gate
        run: ../.github/scripts/coverage-gate.sh cover.out 80

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: booth/go.mod
          cache-dependency-path: booth/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt needed on:"; echo "$out"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy drift
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' in booth/ and commit."
            exit 1
          fi
      - name: golangci-lint
        # Installed directly (not via the marketplace action) to match the repo
        # convention in security.yml and to decouple from the action's
        # golangci-lint-version matrix. Booth is on go 1.26 (its deps — x/net
        # v0.62 etc. — require it), so it pins golangci-lint v2, the series built
        # against go 1.26. (ci.yml's app module stays on go 1.23 + golangci-lint
        # v1.61; the two modules lint independently.)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m ./...
