# Booth CI — ISI-7149 (P3-1). The Booth API is a second Go module in the
# monorepo (board decision #7) under booth/, consuming the operator's CRD types
# via a `replace => ../app` directive. It gets its own pipeline mirroring the
# operator's code CI (ci.yml): build · test · 80% coverage gate · quality.
#
# Path-filtered to booth/** and app/** (a change to the operator's API types can
# break the Booth build through the replace directive) plus this workflow file.
# This is a standalone check, not part of the operator's `ci-required` aggregate,
# so path filtering is safe here — it will not leave PRs stuck pending.
name: booth-ci

on:
  push:
    branches: [main]
    paths: [booth/**, app/api/**, .github/workflows/booth-ci.yml]
  pull_request:
    paths: [booth/**, app/api/**, .github/workflows/booth-ci.yml]

permissions:
  contents: read

concurrency:
  group: booth-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: booth

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: booth/go.mod
          cache-dependency-path: booth/go.sum
      - name: Build
        run: go build ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: booth/go.mod
          cache-dependency-path: booth/go.sum
      - name: Run tests
        run: go test -race -coverprofile=cover.out ./...
      - name: Enforce 80% coverage gate
        run: ../.github/scripts/coverage-gate.sh cover.out 80

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: booth/go.mod
          cache-dependency-path: booth/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needs to be run on:"; echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy drift
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' in booth/ and commit."
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout=5m
          version: v1.61.0
          working-directory: booth
