# Image build & publish — ISI-7093 plan §2 jobs 6 + 9 (built by C3 / ISI-7121).
#
# Builds the ContentRemixer operator container and, on release-class refs,
# publishes a SIGNED, multi-arch image to the dedicated image-only package
# `ghcr.io/contentremixer/content-operator` (the repo the C4 Helm chart pins).
#
#   PRs / design branches : build-only, both arches, GHA cache, NO push, NO creds.
#   push to main          : build + push the `sha-<12>` tag (no `latest`).
#   push to v* tag         : build + push `vX.Y.Z` + `latest` + `sha-<12>`.
#
# Every published image is cosign keyless-signed (Fulcio/Rekor OIDC) and carries
# BuildKit SBOM + max-provenance in-toto attestations in the registry. C2
# (ISI-7120, Trivy/security) consumes the attached SBOM attestation rather than
# regenerating it — see the issue thread for the coordination note.
#
# Scope note: this workflow OWNS image publish for ISI-7093 and supersedes the
# lean `image` job that used to live in operator-ci.yml (removed in this change).
name: image-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - ".github/workflows/image-publish.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/image-publish.yml"

permissions:
  contents: read
  packages: write   # push to GHCR
  id-token: write   # cosign keyless OIDC (Fulcio)

concurrency:
  group: image-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/contentremixer/content-operator
  # Pin cosign so keyless signing is reproducible across runner image bumps.
  COSIGN_VERSION: v2.4.1

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git describe --tags` can resolve VERSION.
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # Tags + VERSION. The `sha-<12hex>` tag format is a hard contract: the C4
      # chart's default appVersion is exactly `sha-<12>`, so C5 renders a valid
      # image ref straight off a main build. `latest` is release-only per the
      # C3 spec ("latest on release"), so main publishes the sha tag alone.
      - name: Compute tags + VERSION
        id: meta
        run: |
          set -euo pipefail
          SHA12="${GITHUB_SHA::12}"
          TAGS="${IMAGE}:sha-${SHA12}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest"
          else
            # describe is non-fatal: a shallow/tagless history falls back to the sha.
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo "sha-${SHA12}")"
          fi
          echo "tags=${TAGS}" >>"$GITHUB_OUTPUT"
          echo "version=${VERSION}" >>"$GITHUB_OUTPUT"
          {
            echo "### image-publish"
            echo "- push: \`${{ github.event_name != 'pull_request' }}\`"
            echo "- version: \`${VERSION}\`"
            echo "- tags:"
            echo "$TAGS" | tr ',' '\n' | sed 's/^/  - `/; s/$/`/'
          } >>"$GITHUB_STEP_SUMMARY"

      # Creds only on push events — PRs stay build-only with no secret exposure.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Multi-arch build. On push: push + attach SBOM & max-provenance in-toto
      # attestations to the registry index. On PR: build both arches to prove
      # the cross-compile, but no push/attest (buildx attestations require a
      # registry target).
      - name: Build + push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------------
      # Sign the pushed image index BY DIGEST (one signature covers every tag
      # and both arches). Keyless: OIDC → Fulcio cert → Rekor transparency log.
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "signed ${IMAGE}@${DIGEST}" >>"$GITHUB_STEP_SUMMARY"
