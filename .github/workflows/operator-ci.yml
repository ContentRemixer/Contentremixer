# Operator CI — ISI-7084 (subtask I) deploy pipeline for the ContentRemixer
# operator. Scope is deliberately minimal: the gates subtask I needs to ship
# the image + validated manifests to `k8Squad test`:
#   secret-scan (design §8 gate) · go build/vet/envtest · image build+push
#   (GHCR) · manifest + kustomize validation.
#
# The comprehensive multi-stage pipeline (cosign, SBOM, trivy, golangci-lint,
# Helm publish, content-CI) is ISI-7093's umbrella and will SUPERSEDE/absorb
# this workflow once the board approves it. Keep this one lean; do not grow it
# into ISI-7093's scope.
name: operator-ci

on:
  push:
    branches: [main, "design/**"]
    tags: ["v*"]
    paths:
      - "app/**"
      - "deploy/**"
      - ".github/workflows/operator-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "deploy/**"
      - ".github/workflows/operator-ci.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: operator-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/contentremixer/operator

jobs:
  # ---------------------------------------------------------------------------
  # Secret scan over the WHOLE repo (content + app/) — design §8. Fail-closed:
  # any finding breaks CI so no credential can land in a commit.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks (filesystem, whole tree)
        run: |
          set -euo pipefail
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          # .gitleaks.toml allowlists the scrubber's secret-shaped test fixtures.
          ./gitleaks detect --source . --no-git --config .gitleaks.toml --redact -v --exit-code 1

  # ---------------------------------------------------------------------------
  # Compile + vet. Proves the binary that gets containerized builds — GATES the
  # image publish below.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: app/go.sum
      - name: build + vet
        run: |
          go build ./...
          go vet ./...

  # ---------------------------------------------------------------------------
  # envtest suite. Gates the image publish: the ReferenceRepo reconciler now
  # Watches Secrets (ISI-7106), so the fail-closed recovery spec is green and
  # this job no longer needs to be de-gated from the publish path.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: app/go.sum
      - name: envtest
        run: |
          set -euo pipefail
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.19
          KUBEBUILDER_ASSETS="$("$(go env GOPATH)/bin/setup-envtest" use 1.31.0 -p path)"
          export KUBEBUILDER_ASSETS
          go test ./... -coverprofile cover.out

  # ---------------------------------------------------------------------------
  # Validate the deploy/ manifests + both kustomize layers render + schema-check.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kustomize + kubeconform
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash -s 5.4.3 .
          sudo mv kustomize /usr/local/bin/
          KC=0.6.7
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KC}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: render + validate base and overlay
        run: |
          set -euo pipefail
          # CRDs carry custom schemas kubeconform cannot resolve; skip-kinds
          # keeps the gate on the standard k8s resources (Deployment, Service,
          # Ingress, Role, Secret, Issuer/Certificate via missing-schemas).
          for layer in deploy/base deploy/overlays/k8squad-test; do
            echo "== kustomize build $layer =="
            kustomize build "$layer" \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -skip CustomResourceDefinition,ModelProfile,ReferenceRepo
          done

  # ---------------------------------------------------------------------------
  # Build (and, off PRs, push) the operator image to GHCR. amd64 only — the
  # homelab nodes are x86_64 (AGENTS.md storage/node notes); multi-arch is
  # ISI-7093's buildx matrix if the board wants it.
  image:
    needs: [secret-scan, build, test, manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: compute tags
        id: meta
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::12}"
          TAGS="${IMAGE}:sha-${SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${TAGS}" >>"$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}-${SHA}" >>"$GITHUB_OUTPUT"
      - name: login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build/push
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          platforms: linux/amd64
          # PRs build-only (no creds, no push); branch/tag pushes publish.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          provenance: false
