# Security CI — ISI-7093 plan §2 jobs 5, 7, 8 (built by C2 / ISI-7120).
#
# The security tier of the Code CI for the ContentRemixer operator (Go, under
# app/). It complements C1's ci.yml (build/test/coverage/quality) and is kept in
# a SEPARATE workflow on purpose:
#   - these jobs need `security-events: write` to publish SARIF to the Security
#     tab; ci.yml stays least-privilege (`contents: read`) for its required
#     aggregate check (C10 / ISI-7123);
#   - a weekly `schedule` re-scans unchanged code so newly-disclosed CVEs surface
#     without a code change.
#
# Jobs:
#   govulncheck  — Go stdlib/dep vuln gate (fails on a reachable vuln).
#   gosec        — Go SAST → SARIF.
#   trivy-fs     — filesystem scan (deps + misconfig + secrets) → SARIF.
#   gitleaks     — secret scanning over the whole tree → SARIF (gate).
#   dependency-review — GitHub dependency-review on PRs only.
#   sbom         — syft SPDX + CycloneDX artifacts (job 8).
#   image-scan   — build app/Dockerfile locally, trivy image → SARIF, FAIL on
#                  HIGH/CRITICAL; accepted exceptions live in root .trivyignore.
#
# Supersedes the security + SBOM stages of the legacy operator-ci.yml. Release
# image attestation (SBOM attached to the signed image) is coordinated with
# C3 / ISI-7121 and is out of scope here.
#
# NOTE: SARIF upload and GITHUB_TOKEN writes are restricted on fork PRs; this
# repo's workflow runs in-repo, so that restriction does not apply here.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-scan (Mondays 06:17 UTC) to catch newly-disclosed CVEs in code
    # that has not changed. Off-the-hour minute to avoid the scheduler stampede.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs for the same PR/branch; never cancel main or cron.
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 5a — govulncheck: fail on a vulnerability that is actually reachable
  # from the operator's call graph (stdlib or module deps). This is a GATE, not
  # just a report — unreachable advisories do not fail the build.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Install govulncheck
        # @latest is intentional for a vuln scanner (always the newest DB/logic);
        # Dependabot/renovate (C-series) may later pin this for reproducibility.
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck ./...
        working-directory: app
        run: govulncheck ./...

  # ---------------------------------------------------------------------------
  # Job 5b — gosec: Go static analysis for insecure code patterns → SARIF.
  # `-no-fail` keeps the job green; findings are triaged in the Security tab.
  # Promote to a gate later if the board wants gosec blocking.
  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec → SARIF
        working-directory: app
        run: gosec -no-fail -fmt sarif -out gosec.sarif ./...
      - name: Upload gosec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: app/gosec.sarif
          category: gosec

  # ---------------------------------------------------------------------------
  # Job 7 — Trivy filesystem scan: vulnerable Go modules, IaC/Dockerfile
  # misconfig, and embedded secrets across the repo → SARIF. Reporting only;
  # the enforced CVE gate is image-scan below.
  trivy-fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan → SARIF
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "0" # report only; do not fail the build on fs findings
      - name: Upload Trivy fs SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ---------------------------------------------------------------------------
  # Job 5c — gitleaks: secret scanning over the full history-less working tree.
  # Binary is pinned and downloaded directly (the v2 marketplace Action requires
  # a GITLEAKS_LICENSE for org-owned repos; this avoids that gate). Fails the
  # build on any finding; SARIF still uploads so the leak is visible.
  #
  # --config .gitleaks.toml is explicit on purpose: the root config allowlists
  # the Mastering scrubber's secret-SHAPED test fixtures (checker_test.go, ISI-
  # 7082) which are present on this base. Relying on gitleaks' implicit root-
  # config auto-load would make a real leak slip through if that file is ever
  # moved; naming it keeps the gate's allowlist unambiguous.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: gitleaks detect → SARIF
        run: |
          gitleaks detect --source . --no-git --config .gitleaks.toml --redact -v \
            --report-format sarif --report-path gitleaks.sarif --exit-code 1
      - name: Upload gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ---------------------------------------------------------------------------
  # Job 5d — GitHub dependency-review: block PRs that introduce known-vulnerable
  # or disallowed-license dependencies. Diff-based, so PR-only.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---------------------------------------------------------------------------
  # Job 8 — SBOM: generate SPDX + CycloneDX for the source tree with syft and
  # publish them as build artifacts. Release-image attestation is C3's concern.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Image CVE scan — build the manager image locally (single-arch, --load, no
  # push) and run `trivy image`. SARIF goes to the Security tab; the gate step
  # FAILS the build on HIGH/CRITICAL, honouring accepted exceptions in the
  # reviewed root .trivyignore.
  image-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE: ghcr.io/contentremixer/operator:ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build operator image (local, amd64)
        uses: docker/build-push-action@v6
        with:
          # Context is app/ so the Dockerfile's `COPY go.mod ...` paths resolve
          # (matches `make docker-build`). Dockerfile defaults to {context}/Dockerfile.
          context: app
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: VERSION=ci-${{ github.sha }}
      - name: Trivy image scan → SARIF (report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: "0" # report pass: never block the SARIF upload
      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Trivy image gate — FAIL on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1" # enforced gate
