---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: agents.contentremixer.io
spec:
  group: contentremixer.io
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - agent
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .spec.skillKind
      name: SkillKind
      type: string
    - jsonPath: .spec.modelProfile
      name: Model
      type: string
    - jsonPath: .spec.default
      name: Default
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'Agent is the Schema for the agents API: one configured specialist.'
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentSpec defines a configured specialist: a role label, the Go skill kind that
              implements its behaviour, its model, its prompt skill-packs, and which actor
              template runs it. Admin-owned (platform-wide); Owner is defined for registry
              uniformity but is empty/"platform" in Phase 1.
            properties:
              actorTemplate:
                default: content
                description: |-
                  ActorTemplate selects the actor runtime: the lean "content" actor
                  (prose/code/text, the default) or the fat "media" actor (image/video,
                  ISI-7395). Reuses the ADR-3 ActorTemplateContent/Media constants shared with
                  ReferenceRepo/LabelRoute. Defaults to "content".
                enum:
                - content
                - media
                type: string
              default:
                description: |-
                  Default marks THE canonical Agent for its SkillKind — the fallback a team
                  node may reference by kind, and the row seeded to reproduce today. AT MOST
                  ONE Agent per SkillKind may set this true (webhook, ISI-7800 §4). Zero is
                  allowed.
                type: boolean
              description:
                description: Description is free-text operator context. Optional.
                type: string
              modelProfile:
                description: |-
                  ModelProfile is the litellmName of the ModelProfile this agent requests.
                  Optional — empty or "default" resolves to the system-default ModelProfile.
                  A non-empty, non-"default" value MUST name an existing ModelProfile (webhook
                  hard error otherwise — fail closed, same stance as the engine). See
                  ISI-7800 §2.2 for the global→per-agent→per-call resolution order.
                type: string
              owner:
                description: Owner — platform-owned (empty) in Phase 1; present for
                  registry uniformity.
                properties:
                  subject:
                    description: |-
                      Subject is the IdP subject (OIDC `sub`) of the owning DevRel, or empty
                      for Admin/platform-owned resources.
                    type: string
                type: object
              role:
                description: Role is the human-facing label, e.g. "System Architect".
                  Required.
                minLength: 1
                type: string
              skillKind:
                description: SkillKind selects the Go behaviour (closed set — see
                  KnownSkillKinds).
                enum:
                - architect
                - research
                - coding
                - observability
                - graphic
                - writer
                type: string
              skillPacks:
                description: |-
                  SkillPacks are named markdown prompt packs layered on top of the skill's
                  base prompt (the writer already loads a "skill pack"). Each name must
                  resolve to a pack the actor can load; unknown packs degrade (warn), they do
                  not fail admission. Optional.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
            required:
            - role
            - skillKind
            type: object
          status:
            description: AgentStatus defines the observed state of an Agent.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
