---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: devrelpersonas.contentremixer.io
spec:
  group: contentremixer.io
  names:
    kind: DevRelPersona
    listKind: DevRelPersonaList
    plural: devrelpersonas
    shortNames:
    - persona
    - personas
    singular: devrelpersona
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.owner.subject
      name: Owner
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.exemplarCount
      name: Exemplars
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DevRelPersona is the Schema for the devrelpersonas API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DevRelPersonaSpec defines the desired state of a DevRelPersona: an
              owner-scoped style profile the writer conditions on. Unlike the Phase-1
              Admin-owned CRDs, a DevRelPersona REQUIRES an owner (design §6 ownership:
              `role==Admin OR resource.owner==subject`); the owner is enforced non-empty
              by the validating webhook.
            properties:
              owner:
                description: |-
                  Owner is the DevRel that owns this persona. REQUIRED for DevRelPersona
                  (Owner.Subject must be non-empty) — the Booth API scopes list/get/mutate
                  by it. Reuses the shared OwnerRef so the ownership filter is uniform
                  across all CRDs (see OwnerRef).
                properties:
                  subject:
                    description: |-
                      Subject is the IdP subject (OIDC `sub`) of the owning DevRel, or empty
                      for Admin/platform-owned resources.
                    type: string
                type: object
              references:
                description: |-
                  References are the style exemplars to ingest (talks, posts). A change to
                  this list is what the reconciler turns into scrape→embed work.
                items:
                  description: PersonaReference is a single style exemplar source.
                  properties:
                    kind:
                      description: |-
                        Kind selects how P2-B fetches the exemplar: youtube | article.
                        The closed set mirrors KnownReferenceKinds; the validating webhook
                        rejects anything else with a message naming the allowed kinds.
                      enum:
                      - youtube
                      - article
                      type: string
                    url:
                      description: URL of the exemplar (a YouTube video or an article
                        page).
                      minLength: 1
                      type: string
                  required:
                  - kind
                  - url
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              retrieval:
                description: |-
                  Retrieval tunes top-k owner-scoped exemplar retrieval at write time
                  (design §5). Optional; defaults apply when unset. Read by the P2-D writer
                  conditioner (ISI-7147), never by the ingestion reconciler.
                properties:
                  minScore:
                    description: |-
                      MinScore drops exemplars below this cosine similarity (0..1), as a decimal
                      string so the CRD does not depend on float OpenAPI semantics. Empty or "0"
                      keeps all top-k; a malformed value is treated as 0 by the conditioner
                      (best-effort, never fails the run).
                    type: string
                  topK:
                    default: 5
                    description: |-
                      TopK is the maximum number of voice exemplars injected into the writer
                      prompt. Defaults to 5 when zero.
                    maximum: 20
                    minimum: 1
                    type: integer
                type: object
              selfDescription:
                description: |-
                  SelfDescription is a free-text description of the persona's voice/style.
                  The agent may author or refine it (P2-D writer feedback loop); it seeds
                  the style prompt even before any references are embedded.
                type: string
            required:
            - owner
            type: object
          status:
            description: DevRelPersonaStatus defines the observed state of a DevRelPersona.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              exemplarCount:
                description: |-
                  ExemplarCount is the number of exemplars successfully embedded. Owned by
                  P2-C; P2-A never writes it.
                type: integer
              lastEmbeddedAt:
                description: LastEmbeddedAt is when the style index was last (re)built.
                  Owned by P2-C.
                format: date-time
                type: string
              observedReferenceHash:
                description: |-
                  ObservedReferenceHash is the fingerprint of the spec.references list the
                  reconciler last enqueued. It is the P2-A edge-trigger: a mismatch between
                  this and the live spec is what moves the persona back to Pending. Owned
                  by P2-A exclusively.
                type: string
              phase:
                description: |-
                  Phase is the ingestion phase (see the PersonaPhase* constants). P2-A
                  drives Idle/Pending; P2-B/P2-C drive Scraping/Embedding/Ready/Error.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
