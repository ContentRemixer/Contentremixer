---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-contentremixer-io-v1alpha1-modelprofile
  failurePolicy: Fail
  name: vmodelprofile-v1alpha1.contentremixer.io
  rules:
  - apiGroups:
    - contentremixer.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - modelprofiles
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-contentremixer-io-v1alpha1-referencerepo
  failurePolicy: Fail
  name: vreferencerepo-v1alpha1.contentremixer.io
  rules:
  - apiGroups:
    - contentremixer.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - referencerepos
  sideEffects: None
