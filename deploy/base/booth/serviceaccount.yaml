# Booth ServiceAccount (ISI-7340, ISI-7334 Phase 2).
#
# `booth` is the identity of the Booth API server itself: one controller-runtime
# client (session-scoped inside the app, design §6.2 — k8s RBAC does NOT do the
# per-user scoping) that reads/writes the CRs the Booth API exposes, and creates
# scraper-review batch Jobs. Its permissions live in rbac.yaml (namespaced Role
# — booth caches nothing, unlike the operator's cluster-scope cache).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: booth
  namespace: contentremixer
  labels:
    app.kubernetes.io/name: booth
    app.kubernetes.io/part-of: contentremixer
---
# `booth-scraper` runs the scrape-review Job pods the Booth launcher creates
# (booth/internal/scrapejobs.K8sLauncher enforces ServiceAccountName). It needs
# NO cluster API access — the scrape job only reaches Postgres (REVIEW_DSN
# injected as a SecretKeyRef by the launcher) and the public internet. It exists
# solely so the Job pods authenticate instead of erroring on a missing SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: booth-scraper
  namespace: contentremixer
  labels:
    app.kubernetes.io/name: booth
    app.kubernetes.io/component: scraper
    app.kubernetes.io/part-of: contentremixer
