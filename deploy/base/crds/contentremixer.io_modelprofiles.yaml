---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: modelprofiles.contentremixer.io
spec:
  group: contentremixer.io
  names:
    kind: ModelProfile
    listKind: ModelProfileList
    plural: modelprofiles
    shortNames:
    - mp
    singular: modelprofile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .spec.default
      name: Default
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelProfile is the Schema for the modelprofiles API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ModelProfileSpec defines the desired state of a ModelProfile: one CR per
              LiteLLM model backend. Admin-owned (platform-wide).
            properties:
              apiBase:
                description: |-
                  APIBase overrides the endpoint for openai-compatible / self-hosted backends
                  (e.g. the homelab agentgateway/LiteLLM endpoint). Optional.
                type: string
              apiKeyRef:
                description: |-
                  APIKeyRef references the Secret key holding this backend's API key.
                  Optional for keyless local backends (e.g. ollama).
                properties:
                  key:
                    minLength: 1
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              default:
                description: |-
                  Default marks the system default model. EXACTLY ONE ModelProfile in the
                  namespace may set this true. Enforced by the validating webhook (§2.1a) and
                  re-checked by the controller (defence in depth).
                type: boolean
              litellmName:
                description: |-
                  LiteLLMName is the public alias exposed by the gateway (the name agents request,
                  e.g. "default", "fast", "long-context"). Must be unique across ModelProfiles;
                  uniqueness is enforced by the webhook and re-checked by the controller.
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              model:
                description: |-
                  Model is the provider model id (e.g. "gpt-4o", "claude-opus-4", "llama3.1:70b").
                  Rendered into LiteLLM `model` as "<provider>/<model>" unless APIBase overrides.
                minLength: 1
                type: string
              owner:
                description: Owner — see OwnerRef. Admin/platform-owned when empty
                  (the Phase-1 default).
                properties:
                  subject:
                    description: |-
                      Subject is the IdP subject (OIDC `sub`) of the owning DevRel, or empty
                      for Admin/platform-owned resources.
                    type: string
                type: object
              provider:
                description: |-
                  Provider is the LiteLLM provider prefix (openai, anthropic, azure, vertex_ai,
                  bedrock, ollama, openai-compatible, ...). Free-form string LiteLLM understands.
                minLength: 1
                type: string
              tags:
                description: |-
                  Tags are capability hints (e.g. ["long-context","vision","cheap"]) the
                  orchestrator may use to pick a non-default model. Informational in Phase 1.
                items:
                  type: string
                type: array
            required:
            - litellmName
            - model
            - provider
            type: object
          status:
            description: ModelProfileStatus defines the observed state of a ModelProfile.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              rendered:
                description: Rendered is true once this profile is present in the
                  generated LiteLLM config.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
