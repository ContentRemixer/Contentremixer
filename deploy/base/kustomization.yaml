# ContentRemixer operator — deployable base (subtask I, ISI-7084).
# Apply via an overlay (`kubectl apply -k deploy/overlays/k8squad-test`); this
# base installs the whole component set from §7 EXCEPT:
#   - Secrets (github-pat / github-webhook / model keys) — created out-of-band,
#     NEVER committed (design §8; see deploy/README.md for the mechanism).
#   - Example CRs (deploy/secrets/*.example.yaml, models.example.yaml) — those
#     are documentation of the SecretKeyRef shape, not install artifacts.
#   - cert-manager itself + the cluster's ingress mechanism (k8Squad test:
#     kgateway + MetalLB) — cluster prerequisites the overlay builds on.
#
# Cluster-specific values (image tag, Ingress host, cluster-issuer, ingress
# class) live in the overlay, not here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - operator/namespace.yaml
  - crds/contentremixer.io_modelprofiles.yaml
  - crds/contentremixer.io_referencerepos.yaml
  - crds/contentremixer.io_devrelpersonas.yaml
  - operator/serviceaccount.yaml
  - operator/rbac.yaml
  - operator/certificates.yaml
  - operator/admission-service.yaml
  - operator/webhook-configuration.yaml
  - operator/deployment.yaml
  - webhook/github-webhook-service.yaml
  - litellm/litellm.yaml
  # P2-deploy (ISI-7148, design §7): the single relational+vector store.
  # The pgvector-credentials Secret is created out-of-band (see
  # ../secrets/pgvector-credentials.example.yaml) — NOT listed here.
  - postgres/statefulset.yaml
  - postgres/service.yaml
  # NB: no Ingress here — webhook exposure is cluster-specific and lives in the
  # overlay (k8Squad test uses kgateway + MetalLB, see overlays/k8squad-test).

images:
  - name: ghcr.io/contentremixer/operator
    newTag: latest # overlay pins a real sha-/vX.Y.Z tag
