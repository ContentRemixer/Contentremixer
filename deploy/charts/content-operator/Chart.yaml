apiVersion: v2
name: content-operator
description: >-
  ContentRemixer operator — the Phase-1 CRD-driven platform (design §7):
  manager with the ModelProfile + ReferenceRepo controllers, the admission
  webhook, the GitHub delivery receiver, and the LiteLLM gateway. Authored
  from the deploy/base kustomize manifests (ISI-7116, C4 of ISI-7093).
type: application

# Chart version — bump on chart changes.
version: 0.1.0

# appVersion = the operator image tag rendered by default (overridable via
