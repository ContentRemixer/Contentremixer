# image (operator-ci run 42063258626, commit 7fdf948).
appVersion: "sha-7fdf9483ab28"

kubeVersion: ">=1.27.0-0"

keywords:
  - contentremixer
  - operator
  - content
  - kubernetes-operator
home: https://github.com/henrikrexed/contentremixer
sources:
