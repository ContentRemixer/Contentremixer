---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: agentteams.contentremixer.io
spec:
  group: contentremixer.io
  names:
    kind: AgentTeam
    listKind: AgentTeamList
    plural: agentteams
    shortNames:
    - agentteam
    - team
    singular: agentteam
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.entry
      name: Entry
      type: string
    - jsonPath: .status.nodeCount
      name: Nodes
      type: integer
    - jsonPath: .spec.default
      name: Default
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'AgentTeam is the Schema for the agentteams API: one orchestration
          DAG.'
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentTeamSpec is one orchestration DAG: an entry node, a set of nodes each
              bound to an Agent, and the hand-off edges. This is the data form of the
              hardcoded orchestrator.DefaultEngine() wiring on main. Admin-owned.
            properties:
              default:
                description: |-
                  Default marks the team the engine uses when a run names no team. AT MOST ONE
                  AgentTeam may set this true (webhook). Zero is allowed (degraded; engine
                  fails closed if a run arrives with no resolvable team).
                type: boolean
              edges:
                description: |-
                  Edges are the directed hand-offs. Together with Nodes they MUST form a DAG
                  rooted at Entry: no cycles, every endpoint a declared node, every non-entry
                  node reachable from Entry (webhook + engine, ISI-7800 §4). Empty edges = a
                  single-node team (the linear-writer case).
                items:
                  description: 'AgentEdge is a directed hand-off: the From node must
                    complete before To runs.'
                  properties:
                    from:
                      minLength: 1
                      type: string
                    to:
                      minLength: 1
                      type: string
                  required:
                  - from
                  - to
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              entry:
                description: |-
                  Entry is the node id that starts the run (the planner/architect). MUST be a
                  declared node id (webhook). The engine runs it first; its outline is adopted
                  by downstream nodes (mirrors orchestrator: architect produces the Outline).
                minLength: 1
                type: string
              nodes:
                description: Nodes are the specialists in this team. Node ids must
                  be unique.
                items:
                  description: AgentNode binds a stable node id in the DAG to a specific
                    Agent CR.
                  properties:
                    agentRef:
                      description: |-
                        AgentRef is the metadata.name of the Agent this node runs. MUST resolve to
                        an existing Agent (webhook + engine hard error otherwise — fail closed).
                      minLength: 1
                      type: string
                    id:
                      description: |-
                        ID is the node identifier, unique within the team. Referenced by Entry and
                        by Edges. Also the orchestrator anchor-owner id.
                      minLength: 1
                      type: string
                  required:
                  - agentRef
                  - id
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              owner:
                description: Owner — platform-owned (empty) in Phase 1; present for
                  registry uniformity.
                properties:
                  subject:
                    description: |-
                      Subject is the IdP subject (OIDC `sub`) of the owning DevRel, or empty
                      for Admin/platform-owned resources.
                    type: string
                type: object
            required:
            - entry
            - nodes
            type: object
          status:
            description: AgentTeamStatus defines the observed state of an AgentTeam.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              nodeCount:
                description: NodeCount mirrors len(spec.nodes) for the list print
                  column.
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
