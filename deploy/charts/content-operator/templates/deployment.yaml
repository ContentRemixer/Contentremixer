# Operator Deployment (design §7): manager with both controllers + the
# admission webhook server + the GitHub delivery receiver. Leader-elected.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.operator.name }}
  namespace: {{ include "content-operator.namespace" . }}
  labels:
    {{- include "content-operator.operatorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      {{- include "content-operator.operatorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "content-operator.operatorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "content-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.operator.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: {{ include "content-operator.operatorImage" . }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            {{- toYaml .Values.operator.args | nindent 12 }}
          ports:
            - name: admission
              containerPort: {{ .Values.operator.ports.admission }}
              protocol: TCP
            - name: github
              containerPort: {{ .Values.operator.ports.github }}
              protocol: TCP
          volumeMounts:
            - name: webhook-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            {{- toYaml .Values.operator.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
      volumes:
        - name: webhook-cert
          secret:
            secretName: {{ .Values.webhook.certSecretName }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
