{{- if .Values.rbac.create }}
# Operator RBAC (curated from the controller/webhook kubebuilder markers).
# ClusterRole, not Role: the manager builds a cluster-wide controller-runtime
# cache (no --namespace flag), so its informers list/watch at CLUSTER scope.
# See deploy/base/operator/rbac.yaml for the full rationale (ISI-7077 tracks
# narrowing this back to a namespaced Role once the cache is scoped).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.operator.name }}
  labels:
    {{- include "content-operator.operatorLabels" . | nindent 4 }}
rules:
  - apiGroups: ["contentremixer.io"]
    resources: ["modelprofiles", "referencerepos"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["contentremixer.io"]
    resources: ["modelprofiles/status", "referencerepos/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["contentremixer.io"]
    resources: ["modelprofiles/finalizers", "referencerepos/finalizers"]
    verbs: ["update"]
  # PAT / webhook HMAC resolution (ReferenceRepo controller) and API key
  # resolution (ModelProfile controller). Read-only.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # litellm-config rendering (ModelProfile controller).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # LiteLLM gateway Deployment ownership (ModelProfile controller). No delete.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Leader election lock.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.operator.name }}
  labels:
    {{- include "content-operator.operatorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.operator.name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "content-operator.serviceAccountName" . }}
    namespace: {{ include "content-operator.namespace" . }}
{{- end }}
