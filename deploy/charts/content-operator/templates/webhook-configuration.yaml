{{- if .Values.webhook.enabled }}
# ValidatingWebhookConfiguration (design §7), pointed at the admission Service.
# cert-manager injects the CA bundle from the serving-cert Secret.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ .Values.webhook.name }}
  labels:
    {{- include "content-operator.operatorLabels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ include "content-operator.namespace" . }}/{{ .Values.webhook.certSecretName }}
webhooks:
  - admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ .Values.webhook.serviceName }}
        namespace: {{ include "content-operator.namespace" . }}
        path: /validate-contentremixer-io-v1alpha1-modelprofile
        port: 443
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    sideEffects: None
    name: vmodelprofile-v1alpha1.contentremixer.io
    rules:
      - apiGroups: ["contentremixer.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["modelprofiles"]
        scope: Namespaced
  - admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ .Values.webhook.serviceName }}
        namespace: {{ include "content-operator.namespace" . }}
        path: /validate-contentremixer-io-v1alpha1-referencerepo
        port: 443
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    sideEffects: None
    name: vreferencerepo-v1alpha1.contentremixer.io
    rules:
      - apiGroups: ["contentremixer.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["referencerepos"]
        scope: Namespaced
  - admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: {{ .Values.webhook.serviceName }}
        namespace: {{ include "content-operator.namespace" . }}
        path: /validate-contentremixer-io-v1alpha1-devrelpersona
        port: 443
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    sideEffects: None
    name: vdevrelpersona-v1alpha1.contentremixer.io
    rules:
      - apiGroups: ["contentremixer.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["devrelpersonas"]
        scope: Namespaced
{{- end }}
