# OTel Collector (contrib distro) for persona/RAG telemetry on k8Squad test
# (O11y-4, ISI-7161). Single replica is right for the test tier: tail_sampling
# is stateful (a trace's spans must reach ONE instance for the sampling decision),
# so scaling out would need a load-balancing exporter tier in front — out of
# scope for P2 (§7). The config is mounted from the otel-collector-config
# ConfigMap generated by kustomize from collector/otel-collector-config.yaml;
# editing that config needs a manual `kubectl rollout restart` to take effect
# (the generated ConfigMap name is stable — see the overlay kustomization).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: contentremixer
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: contentremixer
    app.kubernetes.io/component: telemetry-collector
spec:
  replicas: 1
  strategy:
    type: Recreate # stateful tail_sampling buffer — don't run two at once
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: contentremixer
        app.kubernetes.io/component: telemetry-collector
    spec:
      serviceAccountName: otel-collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          # Canonical contrib distro on GHCR (not docker.io). Carries every
          # component in otel-collector-config.yaml (validated in CI by
          # hack/validate-collector-config.sh) — no custom OCB build (§8).
          # Bump deliberately: a Collector bump can change config schema.
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.116.0
          args: ["--config=/etc/otel/otel-collector-config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          env:
            # Dynatrace OTLP egress — endpoint + Api-Token from the dynatrace-otlp
            # Secret (dynatrace-otlp.example.yaml), created out-of-band. NEVER in
            # the repo. ${env:...} in the config resolves these.
            - name: DT_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: dynatrace-otlp
                  key: DT_OTLP_ENDPOINT
            - name: DT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dynatrace-otlp
                  key: DT_API_TOKEN
            # GOMEMLIMIT backstops the memory_limiter processor against the pod
            # limit so the Go runtime GCs before the kubelet OOM-kills us.
            - name: GOMEMLIMIT
              value: "400MiB"
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
