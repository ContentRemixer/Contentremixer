# ServiceAccount for the OTel Collector. The k8sattributes processor and the
# k8s_cluster receiver authenticate as this SA (auth_type: serviceAccount) to
# read pod/namespace/node/workload metadata — RBAC is in rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: contentremixer
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: contentremixer
    app.kubernetes.io/component: telemetry-collector
