# Dynatrace OTLP egress Secret — SHAPE ONLY (O11y-4, ISI-7161). Placeholder
# values, NEVER real tokens, NEVER applied as-is (gitleaks scans this path).
#
# Consumed by the OTel Collector (collector/deployment.yaml) to export traces,
# metrics and logs to Dynatrace via OTLP/HTTP:
#   - DT_OTLP_ENDPOINT — the tenant OTLP base, e.g.
#       https://<env-id>.live.dynatrace.com/api/v2/otlp
#     (the otlphttp exporter appends /v1/traces, /v1/metrics, /v1/logs).
#   - DT_API_TOKEN — an API token with the OTLP ingest scopes:
#       openTelemetryTrace.ingest, metrics.ingest, logs.ingest.
#
# Create it out-of-band before applying the overlay (token from the dtctl-managed
# vault, never the repo):
#
#   kubectl -n contentremixer create secret generic dynatrace-otlp \
#     --from-literal=DT_OTLP_ENDPOINT="https://<env-id>.live.dynatrace.com/api/v2/otlp" \
#     --from-literal=DT_API_TOKEN="dt0c01.XXXX.YYYY"
apiVersion: v1
kind: Secret
metadata:
  name: dynatrace-otlp
  namespace: contentremixer
  labels:
    app.kubernetes.io/part-of: contentremixer
type: Opaque
stringData:
  DT_OTLP_ENDPOINT: "https://REPLACE_ENV_ID.live.dynatrace.com/api/v2/otlp"
  DT_API_TOKEN: "REPLACE_ME_WITH_A_DYNATRACE_API_TOKEN"
