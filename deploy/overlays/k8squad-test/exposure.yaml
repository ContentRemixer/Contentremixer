# k8Squad test webhook exposure (subtask I, ISI-7084).
#
# The design (§7) called for a "TLS Ingress", but k8Squad test has NO ingress
# controller — it does ingress with the Gateway API via **kgateway**
# (GatewayClass `kgateway`) fronted by **MetalLB** LoadBalancer IPs (the
# cluster's L2 pool; internal network detail — deliberately NOT committed).
# So the concrete exposure ProxOps finalised is a
# kgateway Gateway + HTTPRoute, not an Ingress. TLS is terminated at the
# Gateway; the receiver stays plain-HTTP on :8443 (app/internal/githubapp).
#
# LoadBalancer IP POLICY (ISI-7340 security review, board-directed): this repo
# is public, so NO internal LAN IP is committed. The stable pin is applied
# OUT OF BAND, exactly like the Secrets (deploy/README.md §secrets): ProxOps
# annotates the kgateway-generated Gateway Service with
# `metallb.universe.tf/loadBalancerIPs: <chosen-pool-IP>`
# (the pool re-carve chose a conflict-free in-pool address, recorded in the
# internal ops tracker). Do NOT add spec.addresses back here without scrubbing
# the IP — MetalLB's Service annotation is the single pin mechanism, survives
# Gateway re-applies, and keeps the LAN topology private.
# The board test URL (internal — see ISI-7334/ISI-7340) serves the plain-HTTP
# listener -> booth:8080 (HTTPRoute below); the HTTPS listener keeps serving
# the webhook with the self-signed cert.
#
# The TLS cert is self-signed (cert-manager `contentremixer-selfsigned`
# Issuer) because k8Squad test has no public ClusterIssuer; for real github.com
# delivery over the public internet, replace with a public-DNS host + an
# ACME/real issuer and point the GitHub webhook at that host (deploy/README).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: contentremixer
  namespace: contentremixer
  labels:
    app.kubernetes.io/part-of: contentremixer
spec:
  gatewayClassName: kgateway
  # NB: no spec.addresses — the LoadBalancer pin lives out of band (see the
  # POLICY block above), so the public repo never states the LAN IP.
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: github-webhook-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-webhook
  namespace: contentremixer
  labels:
    app.kubernetes.io/part-of: contentremixer
spec:
  parentRefs:
    - name: contentremixer
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /github/webhook
      backendRefs:
        - name: operator-webhook
          port: 8443
---
# Booth web UI / API (ISI-7340): the board test URL. Serves the SPA root and
# the /v1/* API from the booth Service (:8080, deploy/base/booth). Attached to
# BOTH listeners so the UI also answers over the self-signed HTTPS listener —
# on that listener the MORE-SPECIFIC /github/webhook PathPrefix above still
# wins for webhook traffic (Gateway API path precedence), so the receiver is
# unaffected. `/` trailing-slash paths (/, /login, /content, ...) resolve to the
# SPA; the webhook route never matches those.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: booth
  namespace: contentremixer
  labels:
    app.kubernetes.io/part-of: contentremixer
spec:
  parentRefs:
    - name: contentremixer
      sectionName: http
    - name: contentremixer
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: booth
          port: 8080
---
# Self-signed serving cert for the Gateway HTTPS listener. SANs cover the
# internal host so the endpoint verifies over TLS from the LAN. Swap for a
# real issuer + public host for github.com delivery. NO IP SAN: the LB IP is
# internal-only and lives out of band (see the POLICY block above); use the
# DNS SAN (or /etc/hosts) for the TLS listener on the LAN.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: github-webhook-tls
  namespace: contentremixer
  labels:
    app.kubernetes.io/part-of: contentremixer
spec:
  secretName: github-webhook-tls
  issuerRef:
    name: contentremixer-selfsigned
    kind: Issuer
  dnsNames:
    - recycler.k8squad.test
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
