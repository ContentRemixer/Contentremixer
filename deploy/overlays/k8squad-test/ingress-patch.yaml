# k8Squad test Ingress finalisation (subtask I). Strategic-merge patch over the
# base github-webhook Ingress. The three CONFIRM-ME values are the only live
# facts needed to make the GitHub webhook reachable over TLS on this cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: github-webhook
  namespace: contentremixer
  annotations:
    # CONFIRM-ME #2: the cert-manager ClusterIssuer that serves the homelab
    # domain on k8Squad test (e.g. letsencrypt-prod, or the internal homelab CA).
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # GitHub posts a compact JSON issues payload; 1 MiB matches the receiver's
    # maxBodyBytes cap (app/internal/githubapp/webhook.go).
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  # CONFIRM-ME #3: k8Squad test's ingress controller class.
  ingressClassName: nginx
  tls:
    - hosts:
        # CONFIRM-ME #1: real host under the homelab domain.
        - recycler.k8squad.CONFIRM-homelab-domain
      secretName: github-webhook-tls
  rules:
    - host: recycler.k8squad.CONFIRM-homelab-domain
      http:
        paths:
          - path: /github/webhook
            pathType: Prefix
            backend:
              service:
                name: operator-webhook
                port:
                  number: 8443
