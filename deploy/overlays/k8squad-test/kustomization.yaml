# k8Squad test overlay (subtask I, ISI-7084). `kubectl apply -k
# deploy/overlays/k8squad-test` installs the operator onto the named test
# cluster (create the Secrets out-of-band first — see deploy/README.md).
#
# Exposure for this cluster is kgateway (Gateway API) + MetalLB, in
# exposure.yaml — k8Squad test has no ingress controller, so the base's
# generic Ingress is NOT used here. The image tag is pinned to the CI-published
# sha tag (operator-ci.yml); bump deliberately on release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - exposure.yaml
  # O11y-4 (ISI-7161): the telemetry collection plane for persona/RAG — the OTel
  # Collector (strategy §8) and the postgres_exporter pgvector vantage (§9). Both
  # live in the overlay, not base, because telemetry EGRESS (Dynatrace OTLP) is
  # cluster-specific; kind-e2e/envtest run without them.
  - collector/serviceaccount.yaml
  - collector/rbac.yaml
  - collector/deployment.yaml
  - collector/service.yaml
  - collector/networkpolicy.yaml
  - postgres-exporter/deployment.yaml
  - postgres-exporter/service.yaml
  - postgres-exporter/networkpolicy.yaml

# The Collector config is mounted from a generated ConfigMap built from the SAME
# file CI validates (hack/validate-collector-config.sh), so config and validation
# can never drift. The name-suffix hash is disabled so the generated name is a
# stable `otel-collector-config` that the Deployment's static volume ref always
# matches (the embedded kustomize applier does not rewrite pod volume configMap
# refs to a hashed name). Trade-off: editing the config does NOT auto-roll the
# pod — run `kubectl -n contentremixer rollout restart deploy/otel-collector`
# after changing it (documented in deploy/README.md).
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: otel-collector-config
    files:
      - otel-collector-config.yaml=collector/otel-collector-config.yaml

# Pin the pgvector PVC to local-path (per-node local disk), NOT the
# cluster-default nfs-csi: a single-replica Postgres fsyncing to shared NFS is
# the stall pattern this homelab has hit before, and the persona corpus is
# re-derivable by re-indexing (§7/§11) so it needs no shared/migratable volume.
# JSON6902 (not strategic-merge): volumeClaimTemplates is an atomic list, so a
# merge patch would REPLACE the entry and drop accessModes/resources.
patches:
  - target:
      kind: StatefulSet
      name: pgvector
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path
  # Operator env (O11y-4 OTLP export + ISI-7237 recycle enablement).
  # JSON6902 (not a strategic-merge Deployment fragment): a merge fragment is
  # scanned by Trivy as a standalone workload and false-flags "no securityContext"
  # (the real hardening lives in the base). An op-list adds the env without
  # looking like a workload. containers/0 is the sole `manager` container.
  #
  # The OTEL_* / POD_NAMESPACE entries point persona/RAG telemetry at the
  # Collector (ISI-7161).
  #
  # RECYCLE_CHECKOUT_PATH + LITELLM_ENDPOINT (ISI-7237) take the GitHub receiver
  # out of ack-only mode: cmd/main.go enables the recycle pipeline only when
  # BOTH are non-empty (otherwise it logs "recycle pipeline ack-only"). The
  # dry-run (ISI-7185) proved the operator deploys but never processed recycle
  # issues precisely because these were unset.
  #   - RECYCLE_CHECKOUT_PATH: local reference-repo checkout (content/, styles/,
  #     meta.yaml) the analyzer reads. It still needs POPULATING and a `git`
  #     binary in the image for analyzer.Commit() — tracked as the ISI-7237
  #     follow-up under ISI-7185; this var is the config seam, not the clone.
  #   - LITELLM_ENDPOINT: the in-cluster LiteLLM gateway Service (base litellm,
  #     port 4000) the writer generates through.
  #   - LITELLM_API_KEY: gateway master key IF the gateway is configured with
  #     one. OPTIONAL — the Phase-1 gateway is keyless (no master_key rendered),
  #     so the Secret may be absent; optional:true keeps the pod schedulable.
  #   - PGVECTOR_DSN: enables P2-D persona voice conditioning (design §5). Reuses
  #     the existing pgvector-credentials/DSN (ISI-7148). OPTIONAL — absent => the
  #     conditioner stays nil and runs are style-only (Phase-1), never a boot fail.
  #   - PERSONA_NAMESPACE is intentionally omitted: cmd/main.go defaults it to
  #     POD_NAMESPACE (set above) when empty.
  - target:
      kind: Deployment
      name: contentremixer-operator
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otel-collector.contentremixer.svc.cluster.local:4317"
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: "grpc"
          - name: OTEL_SERVICE_NAME
            value: "contentremixer-operator"
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: "service.namespace=contentremixer,deployment.environment=k8squad-test"
          - name: RECYCLE_CHECKOUT_PATH
            value: "/workspace/checkout"
          - name: LITELLM_ENDPOINT
            value: "http://litellm.contentremixer.svc.cluster.local:4000"
          # ISI-7244 (ISI-7185 first live recycle): the writer sends
          # chat/completions with model=$LITELLM_DEFAULT_MODEL. cmd/main.go left
          # it empty on the assumption the gateway would fall back to the
          # default ModelProfile, but this LiteLLM config rejects model=None
          # ("Invalid model name passed in model=None") - it serves exactly one
          # route named "default" (model-default-shim). Pin the gateway's served
          # model name here so recycle runs reach writer->checker->PR instead of
          # erroring 400 at the writer stage.
          - name: LITELLM_DEFAULT_MODEL
            value: "default"
          - name: LITELLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: litellm-credentials
                key: apikey
                optional: true
          - name: PGVECTOR_DSN
            valueFrom:
              secretKeyRef:
                name: pgvector-credentials
                key: DSN
                optional: true
      # ISI-7239 (ISI-7185 follow-up): POPULATE the checkout the env above only
      # NAMED. An init container shallow-clones the reference repo into a shared
      # emptyDir the manager mounts read-only at RECYCLE_CHECKOUT_PATH, so
      # analyzer.LocalFS finds content/, styles/, meta.yaml AND a real .git for
      # Commit() (Sample.SourceCommit). Without this the receiver leaves
      # ack-only mode but every run errors at the analyzer stage on an empty
      # checkout. The clone uses the same github-pat Secret the receiver acks
      # with (contents:read is sufficient for the clone).
      #
      # Commit() reads .git plumbing directly (no git binary in the distroless
      # manager image), so the manager mount is read-only; only this init
      # container needs git, and it is a throwaway image that never serves
      # traffic.
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: recycle-checkout-sync
            # alpine/git v2.47.2, digest-pinned (matches the overlay's
            # pin-by-digest convention for third-party images). Bump the tag AND
            # digest together.
            image: alpine/git:v2.47.2@sha256:062a01ad7a0eb17cff382bc5e26086b4d710e56dfdfdf001109a49b6d9bd378c
            command:
              - /bin/sh
              - -ec
              - |
                git clone --depth 1 --branch "${RECYCLE_REF:-main}" \
                  "https://x-access-token:${GITHUB_TOKEN}@github.com/${RECYCLE_REPO}.git" \
                  /workspace/checkout
                echo "recycle-checkout-sync: cloned ${RECYCLE_REPO}@$(git -C /workspace/checkout rev-parse HEAD)"
            env:
              - name: RECYCLE_REPO
                value: "ContentRemixer/Contentremixer"
              - name: RECYCLE_REF
                value: "main"
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: github-pat
                    key: token
              # readOnlyRootFilesystem below means git may only write to the
              # mounted volumes; point HOME/TMPDIR at the scratch emptyDir and
              # disable system config so no write touches the root FS.
              - name: HOME
                value: /tmp
              - name: TMPDIR
                value: /tmp
              - name: GIT_CONFIG_NOSYSTEM
                value: "1"
              - name: GIT_TERMINAL_PROMPT
                value: "0"
            volumeMounts:
              - name: recycle-checkout
                mountPath: /workspace/checkout
              - name: recycle-checkout-tmp
                mountPath: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              # alpine/git defaults to root (0); the pod enforces runAsNonRoot,
              # so pin an unprivileged uid. emptyDir mounts are world-writable,
              # so the clone still writes fine.
              runAsUser: 65532
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 128Mi
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: recycle-checkout
          emptyDir: {}
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: recycle-checkout-tmp
          emptyDir: {}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: recycle-checkout
          mountPath: /workspace/checkout
          readOnly: true

  # ISI-7340 (ISI-7334 Phase 2): the Booth web UI is served over PLAIN HTTP on
  # the internal LAN test URL (board decision: LAN-direct exposure, no TLS edge
  # for the demo; the LAN layout itself is internal — do NOT commit addresses),
  # so the session cookie must drop its Secure flag —
  # otherwise the browser refuses to store it over http://. Base keeps the
  # secure default (design §7 assumes TLS upstream); this cluster-specific
  # override belongs in the overlay. Same JSON6902 style as the operator env
  # patch above (a merge fragment would false-flag in Trivy as a workload).
  - target:
      kind: Deployment
      name: booth
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BOOTH_INSECURE_COOKIE
          value: "true"
  # ISI-7392: the ISI-7340 TEMP node pin is LIFTED. The pin existed because the
  # booth image had to be injected into a single worker's containerd (private
  # package + no in-cluster pull creds). ISI-7392 verified nodes DO reach
  # upstream ghcr.io (ISI-7342 repoint) but get 401 on the private booth package
  # (anonymous token), so a *new* tag cannot be pulled by ANY node while the
  # package stays private. The durable fix is making ghcr.io/contentremixer/booth
  # PUBLIC — then every node pulls anonymously and no node pin / pull secret is
  # needed. With the pin removed, the pod schedules on any worker once the
  # package is public. (If the owner instead supplies a read:packages token,
  # wire it as the `booth` SA's imagePullSecret rather than re-adding this pin.)

images:
  - name: ghcr.io/contentremixer/booth
    # ISI-7392: bumped eae1427662b4 -> b17e54e65ca0 to ship the DevRel
    # self-service onboarding feature (ISI-7350: D0–D9 + D1b). eae1427 (PR #56)
    # predates the onboarding wizard (D6/PR #69) so it does NOT serve it.
    #
    # NOTE on the tag choice: origin/main HEAD is 851d8520899b, but
    # booth-image-publish.yml only triggers on booth/**, app/**, or its own
    # workflow file. The two commits on top of main (PR #72 brand foundation,
    # PR #71 docs) touched ONLY branding/ and docs/, so NO booth image was built
    # for sha-851d852089 (it does not exist in GHCR). The newest published booth
    # image is sha-b17e54e65ca0 (PR #70, ISI-7363 D8 E2E), whose booth/ + web/dist
    # content is byte-identical to current main — so this IS "latest main" for
    # Booth. Bump again only when a future merge rebuilds booth/ or web/dist.
    newTag: sha-b17e54e65ca0
  - name: ghcr.io/contentremixer/operator
    # Redirect to the dedicated image-only package. ISI-7121 moved publishing
    # from the legacy `operator` package to `content-operator`; the legacy pin
    # (sha-7fdf9483ab28) also predates the ISI-7161 `setupOTLP` wiring above, so
    # the operator env patch is a no-op on it. This pin activates OTLP export.
    newName: ghcr.io/contentremixer/content-operator
    # Pinned to an immutable CI tag, NOT :latest, so rollouts are deterministic.
    # ISI-7185 dry-run bump: 6d83a5771309 (PR #29 main-merge, ISI-7161,
    # first `setupOTLP` build) -> a9be806a59e5 (PR #32 head, skills-wired
    # build). Bump to a newer sha-<12> only when app/ changes rebuild it.
    # ISI-7243 live-activation bump: a9be806a59e5 -> d61d7a97901c (PR #44
    # main-merge, ISI-7239). This is the FIRST image carrying the git-less
    # analyzer.LocalFS.Commit() (reads .git plumbing directly, no git binary);
    # under the old pin Commit() still execs `git rev-parse HEAD` which the
    # distroless manager lacks, so every recycle run errored at the analyzer
    # stage. The init-container checkout works on any image; only Commit()
    # needed the rebuild. The later a6063bda merge (ISI-7210) is web-only and
    # did not rebuild content-operator, so d61d7a97901c remains authoritative.
    newTag: sha-d61d7a97901c
