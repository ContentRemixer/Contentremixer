# k8Squad test overlay (subtask I, ISI-7084). `kubectl apply -k
# deploy/overlays/k8squad-test` installs the operator onto the named test
# cluster (create the Secrets out-of-band first — see deploy/README.md).
#
# Exposure for this cluster is kgateway (Gateway API) + MetalLB, in
# exposure.yaml — k8Squad test has no ingress controller, so the base's
# generic Ingress is NOT used here. The image tag is pinned to the CI-published
# sha tag (operator-ci.yml); bump deliberately on release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - exposure.yaml
  # O11y-4 (ISI-7161): the telemetry collection plane for persona/RAG — the OTel
  # Collector (strategy §8) and the postgres_exporter pgvector vantage (§9). Both
  # live in the overlay, not base, because telemetry EGRESS (Dynatrace OTLP) is
  # cluster-specific; kind-e2e/envtest run without them.
  - collector/serviceaccount.yaml
  - collector/rbac.yaml
  - collector/deployment.yaml
  - collector/service.yaml
  - collector/networkpolicy.yaml
  - postgres-exporter/deployment.yaml
  - postgres-exporter/service.yaml
  - postgres-exporter/networkpolicy.yaml

# The Collector config is mounted from a generated ConfigMap built from the SAME
# file CI validates (hack/validate-collector-config.sh), so config and validation
# can never drift. The name-suffix hash is disabled so the generated name is a
# stable `otel-collector-config` that the Deployment's static volume ref always
# matches (the embedded kustomize applier does not rewrite pod volume configMap
# refs to a hashed name). Trade-off: editing the config does NOT auto-roll the
# pod — run `kubectl -n contentremixer rollout restart deploy/otel-collector`
# after changing it (documented in deploy/README.md).
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: otel-collector-config
    files:
      - otel-collector-config.yaml=collector/otel-collector-config.yaml

# Pin the pgvector PVC to local-path (per-node local disk), NOT the
# cluster-default nfs-csi: a single-replica Postgres fsyncing to shared NFS is
# the stall pattern this homelab has hit before, and the persona corpus is
# re-derivable by re-indexing (§7/§11) so it needs no shared/migratable volume.
# JSON6902 (not strategic-merge): volumeClaimTemplates is an atomic list, so a
# merge patch would REPLACE the entry and drop accessModes/resources.
patches:
  - target:
      kind: StatefulSet
      name: pgvector
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path
  # Operator env (O11y-4 OTLP export + ISI-7237 recycle enablement).
  # JSON6902 (not a strategic-merge Deployment fragment): a merge fragment is
  # scanned by Trivy as a standalone workload and false-flags "no securityContext"
  # (the real hardening lives in the base). An op-list adds the env without
  # looking like a workload. containers/0 is the sole `manager` container.
  #
  # The OTEL_* / POD_NAMESPACE entries point persona/RAG telemetry at the
  # Collector (ISI-7161).
  #
  # RECYCLE_CHECKOUT_PATH + LITELLM_ENDPOINT (ISI-7237) take the GitHub receiver
  # out of ack-only mode: cmd/main.go enables the recycle pipeline only when
  # BOTH are non-empty (otherwise it logs "recycle pipeline ack-only"). The
  # dry-run (ISI-7185) proved the operator deploys but never processed recycle
  # issues precisely because these were unset.
  #   - RECYCLE_CHECKOUT_PATH: local reference-repo checkout (content/, styles/,
  #     meta.yaml) the analyzer reads. It still needs POPULATING and a `git`
  #     binary in the image for analyzer.Commit() — tracked as the ISI-7237
  #     follow-up under ISI-7185; this var is the config seam, not the clone.
  #   - LITELLM_ENDPOINT: the in-cluster LiteLLM gateway Service (base litellm,
  #     port 4000) the writer generates through.
  #   - LITELLM_API_KEY: gateway master key IF the gateway is configured with
  #     one. OPTIONAL — the Phase-1 gateway is keyless (no master_key rendered),
  #     so the Secret may be absent; optional:true keeps the pod schedulable.
  #   - PGVECTOR_DSN: enables P2-D persona voice conditioning (design §5). Reuses
  #     the existing pgvector-credentials/DSN (ISI-7148). OPTIONAL — absent => the
  #     conditioner stays nil and runs are style-only (Phase-1), never a boot fail.
  #   - PERSONA_NAMESPACE is intentionally omitted: cmd/main.go defaults it to
  #     POD_NAMESPACE (set above) when empty.
  - target:
      kind: Deployment
      name: contentremixer-operator
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otel-collector.contentremixer.svc.cluster.local:4317"
          - name: OTEL_EXPORTER_OTLP_PROTOCOL
            value: "grpc"
          - name: OTEL_SERVICE_NAME
            value: "contentremixer-operator"
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: "service.namespace=contentremixer,deployment.environment=k8squad-test"
          - name: RECYCLE_CHECKOUT_PATH
            value: "/workspace/checkout"
          - name: LITELLM_ENDPOINT
            value: "http://litellm.contentremixer.svc.cluster.local:4000"
          - name: LITELLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: litellm-credentials
                key: apikey
                optional: true
          - name: PGVECTOR_DSN
            valueFrom:
              secretKeyRef:
                name: pgvector-credentials
                key: DSN
                optional: true

images:
  - name: ghcr.io/contentremixer/operator
    # Redirect to the dedicated image-only package. ISI-7121 moved publishing
    # from the legacy `operator` package to `content-operator`; the legacy pin
    # (sha-7fdf9483ab28) also predates the ISI-7161 `setupOTLP` wiring above, so
    # the operator env patch is a no-op on it. This pin activates OTLP export.
    newName: ghcr.io/contentremixer/content-operator
    # Pinned to an immutable CI tag, NOT :latest, so rollouts are deterministic.
    # ISI-7185 dry-run bump: 6d83a5771309 (PR #29 main-merge, ISI-7161,
    # first `setupOTLP` build) -> a9be806a59e5 (PR #32 head, skills-wired
    # build). Bump to a newer sha-<12> only when app/ changes rebuild it.
    newTag: sha-a9be806a59e5
