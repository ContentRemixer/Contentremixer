# k8Squad test overlay (subtask I, ISI-7084). `kubectl apply -k
# deploy/overlays/k8squad-test` installs the operator onto the named test
# cluster.
#
# Three values below are live-cluster facts ProxOps must confirm against
# k8Squad test before the first apply (tracked on ISI-7084; see
# deploy/README.md §"Cluster facts to confirm"):
#   1. Ingress host   — recycler.<homelab-domain>
#   2. cluster-issuer — the cert-manager ClusterIssuer serving that domain
#   3. ingressClassName — the cluster's ingress controller class
# They are patched in ingress-patch.yaml. The image tag is pinned here to the
# CI-published sha tag (see operator-ci.yml); bump deliberately on release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../

images:
  - name: ghcr.io/contentremixer/operator
    # Pin to an immutable CI tag, NOT :latest, so rollouts are deterministic.
    # Replace with the sha-<12> tag operator-ci published for the deployed SHA.
    newTag: sha-REPLACE_WITH_CI_SHA

patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: github-webhook
