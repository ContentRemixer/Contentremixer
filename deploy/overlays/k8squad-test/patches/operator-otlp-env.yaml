# Point the operator at the in-cluster Collector so its persona/RAG telemetry
# actually flows (O11y-4, ISI-7161). This is the env that flips app/cmd/main.go
# setupOTLP from no-op to live export. Lives in the overlay (not base) so only
# k8Squad test exports — kind-e2e / envtest leave OTEL_EXPORTER_OTLP_ENDPOINT
# unset and stay a no-op.
#
# http:// scheme → the OTLP/gRPC exporter uses an insecure connection, correct
# for in-cluster plaintext to the Collector (TLS terminates nowhere here; the
# traffic never leaves the cluster). Dynatrace egress is TLS, from the Collector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contentremixer-operator
  namespace: contentremixer
spec:
  template:
    spec:
      containers:
        - name: manager
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.contentremixer.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SERVICE_NAME
              value: "contentremixer-operator"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=contentremixer,deployment.environment=k8squad-test"
