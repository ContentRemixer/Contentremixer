# k8Squad test: pin the pgvector PVC to `local-path` (per-node local disk), NOT
# the cluster-default `nfs-csi`. A single-replica Postgres fsyncing to shared
# NFS is the exact stall pattern this homelab has hit before; the persona
# corpus is re-derivable by re-indexing (design §7/§11), so we don't need
# shared/live-migratable storage for it — per-node local-path is faster and
# safer for the DB. local-path is WaitForFirstConsumer, so the PV binds on the
# node the pod schedules to.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgvector
  namespace: contentremixer
spec:
  volumeClaimTemplates:
    - metadata:
        name: pgvector-data
      spec:
        storageClassName: local-path
