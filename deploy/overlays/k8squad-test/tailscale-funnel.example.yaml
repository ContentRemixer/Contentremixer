# Public edge for real github.com webhook delivery — Tailscale Funnel
# (ISI-7126, the board/CEO-chosen Option C for ISI-7112; extended for ISI-7784
# to front BOTH the webhook and the booth board URL under ONE public hostname).
#
# WHY FUNNEL (vs the Cloudflare Tunnel in tunnel.example.yaml): no domain to own
# (the public host is `https://<node>.<tailnet>.ts.net`), no router/WAN change,
# no home-IP exposure, works through CGNAT, and the homelab already runs
# Tailscale. Funnel terminates TLS at the tailnet edge with a **Let's-Encrypt,
# GitHub-trusted cert** — so this path also satisfies ISI-7112 item 2 (no
# on-cluster ACME issuer needed). The origin hop stays inside the cluster: the
# Tailscale operator proxy -> the services below (plain HTTP; the receiver does
# not do TLS; see exposure.yaml).
#
# ONE HOSTNAME, BOTH BACKENDS (ISI-7784): the two path rules below put
#   - `/github/webhook` -> operator-webhook:8443  (GitHub deliveries), and
#   - `/`               -> booth:8080             (the board web UI / API)
# behind the single Funnel host `recycler.<tailnet>.ts.net`. Longest-prefix
# wins, so `/github/webhook` is served by the receiver and every other path by
# booth — identical routing to the kgateway `exposure.yaml`, just TLS-terminated
# publicly by Funnel instead of by the self-signed Gateway listener.
#
# CONSTRAINT: Funnel only serves public ports **443 / 8443 / 10000**. This
# Ingress lands github.com deliveries at
# `https://recycler.<tailnet>.ts.net/github/webhook` on **443**.
#
# PREREQ (owner / tailnet-admin, one-time): the **Tailscale Kubernetes operator**
# must be installed in the cluster (it owns `ingressClassName: tailscale` and
# mints the per-Ingress proxy pod). Install out-of-band with a tailnet OAuth
# client (see deploy/README.md "Real github.com delivery", Option C). Funnel
# must be enabled for the tailnet in the ACL policy (`nodeAttrs` -> `funnel`),
# and HTTPS + MagicDNS must be on. (On the ContentRemixer homelab tailnet these
# ACL/HTTPS/MagicDNS prerequisites are already satisfied — verified ISI-7784;
# the only remaining owner action is minting the operator credential. The
# tailnet name is an internal detail kept out of this public repo.)
#
# SHAPE ONLY — this is an *.example.yaml like deploy/secrets/*. It is NOT in
# kustomization.yaml and is never applied as-is. `tailscale.com/hostname` sets
# the public subdomain: `recycler.<tailnet>.ts.net`.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: contentremixer-funnel
  namespace: contentremixer
  labels:
    app.kubernetes.io/name: contentremixer-funnel
    app.kubernetes.io/part-of: contentremixer
  annotations:
    # Expose this Ingress on the PUBLIC internet via Funnel (not just the
    # tailnet). Without this annotation the operator serves it tailnet-only.
    tailscale.com/funnel: "true"
    # MagicDNS name of the funnel node -> public host recycler.<tailnet>.ts.net.
    tailscale.com/hostname: "recycler"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          # More specific -> the GitHub webhook receiver. Longest-prefix wins.
          - path: /github/webhook
            pathType: Prefix
            backend:
              service:
                name: operator-webhook
                port:
                  number: 8443
          # Everything else -> the booth board web UI / API.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: booth
                port:
                  number: 8080
  # The operator reads this host for the Let's-Encrypt cert SAN / MagicDNS name.
  # Tailscale completes it to recycler.<tailnet>.ts.net; leave the tailnet
  # suffix off here — the operator fills it in.
  tls:
    - hosts:
        - recycler
