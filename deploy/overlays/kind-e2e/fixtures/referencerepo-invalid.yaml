# Negative admission fixture (ISI-7117, reworked ISI-7371). Every field here is
# individually valid against the CRD OpenAPI schema (both outputFormats are in
# the enum blog;short;tutorial;teleprompter) so structural validation ADMITS the
# object and the request reaches the validating webhook. The two labelRoutes
# share the SAME label ("recycle:blog"), which only the webhook can catch —
# ReferenceRepoCustomValidator.validateReferenceRepo rejects duplicate labels
# with a field.Duplicate error. The kind job applies this expecting a NON-ZERO
# kubectl exit whose message names the duplicate — that is the proof the
# admission webhook is actually serving over the cert-manager-issued TLS, not
# merely installed.
#
# Why not a bad outputFormat: the CRD enum rejects an unknown outputFormat
# during structural validation, BEFORE any validating webhook runs, so such a
# fixture never exercises the webhook path (it was the original bug — ISI-7371).
apiVersion: contentremixer.io/v1alpha1
kind: ReferenceRepo
metadata:
  name: contentremixer-crate-invalid
  namespace: contentremixer
spec:
  repo: ContentRemixer/Contentremixer
  tokenRef:
    name: github-pat
    key: token
  webhookSecretRef:
    name: github-webhook
    key: hmac
  prTarget:
    baseBranch: main
    branchPrefix: recycle/
    draft: true
  labelRoutes:
    - label: "recycle:blog"
      inputFormat: auto
      outputFormat: blog
    - label: "recycle:blog"
      inputFormat: auto
      outputFormat: short
