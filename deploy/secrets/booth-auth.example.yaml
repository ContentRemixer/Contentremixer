# Booth AuthN secret (ISI-7150, design §8 — placeholder values only, NEVER real
# secrets). The Booth Deployment mounts these keys as environment variables; the
# auth package reads them at startup (see booth/auth/bootstrap.go).
#
# Board decision #8a: built-in bcrypt user table (no OIDC / no homelab IdP).
# Board decision #8b: the sole initial Admin is the board/owner.
#
# Generate the two real values OUT OF BAND and keep them out of git:
#   session key:  openssl rand -base64 48            # >= 32 bytes after decode
#   admin hash:   htpasswd -bnBC 12 "" '<password>' | tr -d ':\n' | sed 's/^\$2y/\$2a/'
#                 (or any bcrypt tool; cost 12 matches the package default)
apiVersion: v1
kind: Secret
metadata:
  name: booth-auth
  namespace: contentremixer
  labels:
    app.kubernetes.io/part-of: contentremixer
type: Opaque
stringData:
  # HMAC key that signs short-lived session tokens. REQUIRED, >= 32 bytes.
  # Rotating it invalidates all live sessions (intended).
  BOOTH_SESSION_KEY: "REPLACE_ME_WITH_>=32_RANDOM_BYTES"

  # Seed Admin username. Board decision #8b: the owner's chosen username.
  # Defaults to "admin" if omitted — record the owner's real choice here and in
  # issue ISI-7150.
  BOOTH_ADMIN_USERNAME: "admin"

  # Seed Admin credential — provide EXACTLY ONE of the following:
  #   (preferred) a precomputed bcrypt hash, so no plaintext ever reaches the cluster:
  BOOTH_ADMIN_BCRYPT_HASH: "$2a$12$REPLACE_ME_WITH_A_REAL_BCRYPT_HASH......................"
  #   (alternative) a first-run plaintext password, hashed at boot. Comment out
  #   BOOTH_ADMIN_BCRYPT_HASH above if you use this, then rotate to a hash:
  # BOOTH_ADMIN_PASSWORD: "change-me-on-first-login"

  # Optional overrides:
  # BOOTH_SESSION_TTL: "1h"        # Go duration; session lifetime (default 1h)
  # BOOTH_INSECURE_COOKIE: "true"  # drop cookie Secure flag — LOCAL DEV ONLY
