# GitHub App credentials (ISI-7836 — placeholder values only).
#
# One App replaces the per-repo PAT + manual-webhook onboarding dance: onboard
# a repo by installing the App on it (org-wide or per-repo), no PAT and no
# `admin:repo_hook` permission required. The operator reads these two values as
# env (GITHUB_APP_ID / GITHUB_APP_PRIVATE_KEY, see deploy/base/.../deployment)
# and mints short-lived installation tokens for ReferenceRepos that omit
# spec.tokenRef.
#
# Provision (one-time, owner / org admin only — registering the App is
# org-admin-gated; a shared PAT cannot create it):
#
#   1. REGISTER the App. Use the pre-filled link (org-owned so the key/webhook
#      config lives with the org, not a person):
#        https://github.com/organizations/ContentRemixer/settings/apps/new?name=contentremixer-recycler&webhook_active=true&webhook_url=<operator /github/webhook edge>&events[]=issues&issues=write&contents=write&pull_requests=write&metadata=read&public=false
#      Set the App's **Webhook secret** to the SAME value as the github-webhook
#      Secret's `hmac` key, so existing HMAC verification keeps working
#      unchanged (the App secret and github-webhook/hmac MUST match). Click
#      "Create GitHub App".
#
#   2. Read the APP ID. On the App's **General** tab ("About" section) it is
#      shown as "App ID: <number>" — a plain, non-secret integer. This is NOT
#      the "Client ID" (Iv23...) next to it; the operator wants the numeric App
#      ID. The App ID does not exist until the App is created (step 1).
#
#   3. DOWNLOAD the private key. GitHub's current UI (2026): the App's
#      **Credentials** tab -> **Key pairs** -> **New key**. The .pem downloads
#      AUTOMATICALLY and ONLY ONCE, the instant you click "New key" — there is
#      no re-download button afterward (the list shows only a fingerprint +
#      delete). If the download is missed/blocked, click "New key" again (you
#      may hold several keys; delete unused ones). NOTE: the "Client secret"
#      also offered on that tab is for OAuth user-auth and is NOT used here —
#      ignore it; only the key pair matters.
#
#   4. INSTALL the App on the target repo(s): App -> "Install App" ->
#      ContentRemixer -> "Only select repositories" -> pick the repo (e.g.
#      ContentMixer-Data). Per-repo scope — no org-wide access required.
#
# The private key is the PEM GitHub emits (PKCS#1 header "RSA PRIVATE KEY";
# PKCS#8 header "PRIVATE KEY" is also accepted — the operator's minter takes
# either, no conversion needed). Do NOT paste a real key into a git-tracked
# file — create the Secret imperatively so the PEM never touches the repo (this
# keeps secret scanners green):
#
#   kubectl -n contentremixer create secret generic github-app \
#     --from-literal=app-id="$APP_ID" \
#     --from-file=private-key=/path/to/contentremixer-recycler.YYYY-MM-DD.private-key.pem
#   # then roll the operator so it projects the new env and enables the minter:
#   kubectl -n contentremixer rollout restart deployment/contentremixer-operator
#
# Verify the minter picked it up (should log once at startup):
#   kubectl -n contentremixer logs deploy/contentremixer-operator \
#     | grep "GitHub App auth enabled"
# NOTE: the operator Deployment must carry the GITHUB_APP_ID /
# GITHUB_APP_PRIVATE_KEY env (optional secretKeyRef on this Secret); if a live
# cluster was applied before that manifest change, re-apply the operator
# Deployment — creating the Secret alone is not enough.
apiVersion: v1
kind: Secret
metadata:
  name: github-app
  namespace: contentremixer
  labels:
    app.kubernetes.io/part-of: contentremixer
type: Opaque
stringData:
  app-id: "REPLACE_ME_APP_ID"
  # Replace with the full downloaded .pem contents (header line included).
  private-key: "REPLACE_ME_APP_PRIVATE_KEY_PEM"
