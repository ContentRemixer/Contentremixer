# GitHub App credentials (ISI-7836 — placeholder values only).
#
# One App replaces the per-repo PAT + manual-webhook onboarding dance: onboard
# a repo by installing the App on it (org-wide or per-repo), no PAT and no
# `admin:repo_hook` permission required. The operator reads these two values as
# env (GITHUB_APP_ID / GITHUB_APP_PRIVATE_KEY, see deploy/base/.../deployment)
# and mints short-lived installation tokens for ReferenceRepos that omit
# spec.tokenRef.
#
# Provision (one-time, owner only):
#   1. Register the App (ContentRemixer org). Webhook URL = the operator's
#      /github/webhook edge; events = Issues (write), plus Contents/Pull
#      requests (write) + Metadata (read) for PR assembly.
#   2. Set the App's Webhook secret to the SAME value as the github-webhook
#      Secret's `hmac` key, so existing HMAC verification keeps working
#      unchanged (the App secret and github-webhook/hmac must match).
#   3. Generate + download a private key (.pem) and paste it below.
#
# The private-key PEM is PKCS#1 ("BEGIN RSA PRIVATE KEY") as GitHub emits it;
# PKCS#8 ("BEGIN PRIVATE KEY") is also accepted.
apiVersion: v1
kind: Secret
metadata:
  name: github-app
  namespace: contentremixer
  labels:
    app.kubernetes.io/part-of: contentremixer
type: Opaque
stringData:
  app-id: "REPLACE_ME_APP_ID"
  private-key: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_ME_WITH_THE_DOWNLOADED_APP_PRIVATE_KEY_PEM
    -----END RSA PRIVATE KEY-----
