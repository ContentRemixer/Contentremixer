# ModelProfile examples (design §2.1 + §10 open decision #3: the homelab
# agentgateway/LiteLLM endpoint is the recommended Phase-1 default).
# Exactly ONE profile may set spec.default=true (validating webhook).
#
# Subtask C (ISI-7078): per-model API keys are referenced — never inlined —
# via spec.apiKeyRef. The ModelProfile controller wires each ref as a
# MODEL_KEY_<ALIAS> env var on the litellm Deployment and renders
# `api_key: os.environ/MODEL_KEY_<ALIAS>` into the gateway config.
# A referenced-but-missing Secret holds the owning profile at
# Ready=False/APIKeySecretMissing (fail-closed).
apiVersion: contentremixer.io/v1alpha1
kind: ModelProfile
metadata:
  name: default-homelab
  namespace: contentremixer
spec:
  provider: openai-compatible
  model: agentgateway-default
  litellmName: default
  apiBase: http://agentgateway.example.homelab:4000/v1 # subtask I/C: real endpoint
  default: true
  tags: ["long-context"]
  # Keyless local backend: no apiKeyRef needed. To add one:
  # apiKeyRef:
  #   name: model-apikey
  #   key: key
---
apiVersion: contentremixer.io/v1alpha1
kind: ModelProfile
metadata:
  name: fast-openai
  namespace: contentremixer
spec:
  provider: openai
  model: gpt-4o-mini
  litellmName: fast
  tags: ["cheap"]
  apiKeyRef:
    name: openai-apikey
    key: key
---
# Example Secret backing the profile above (design §8: placeholder values
# only — NEVER commit real keys; create real Secrets out-of-band).
apiVersion: v1
kind: Secret
metadata:
  name: openai-apikey
  namespace: contentremixer
  labels:
    app.kubernetes.io/part-of: contentremixer
type: Opaque
stringData:
  key: "sk-REPLACE_ME"
