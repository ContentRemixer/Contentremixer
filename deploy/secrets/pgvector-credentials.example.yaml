# pgvector credentials Secret — SHAPE ONLY (design §7/§9). Placeholder values,
# NEVER real secrets, NEVER applied as-is (gitleaks scans this path — keep the
# values as obvious placeholders).
#
# Two consumers, one Secret:
#   1. the pgvector StatefulSet's postgres container reads POSTGRES_USER /
#      POSTGRES_PASSWORD / POSTGRES_DB to initialise the database, and
#   2. the operator reads DSN via SecretKeyRef to open its pgx pool
#      (store.Open) and apply the idempotent migration on boot.
# The DSN's user/password/db/host MUST match keys (1) and the Service name, or
# the operator connects to a database that does not exist.
#
# Create it out-of-band before applying the overlay (values from your secret
# manager, never the repo):
#
#   PGPASS="$(openssl rand -base64 24)"
#   kubectl -n contentremixer create secret generic pgvector-credentials \
#     --from-literal=POSTGRES_USER=contentremixer \
#     --from-literal=POSTGRES_PASSWORD="$PGPASS" \
#     --from-literal=POSTGRES_DB=contentremixer \
#     --from-literal=DSN="postgres://contentremixer:${PGPASS}@pgvector.contentremixer.svc:5432/contentremixer?sslmode=disable"
#
# (Phase-1 secrets decision #4 — plain Secret for the test tier; promote to
# sealed-secrets / ExternalSecrets for prod with NO manifest change, only this
# provisioning step is replaced. See deploy/README.md.)
apiVersion: v1
kind: Secret
metadata:
  name: pgvector-credentials
  namespace: contentremixer
  labels:
    app.kubernetes.io/part-of: contentremixer
type: Opaque
stringData:
  POSTGRES_USER: "contentremixer"
  POSTGRES_PASSWORD: "REPLACE_ME_WITH_A_RANDOM_PASSWORD"
  POSTGRES_DB: "contentremixer"
  # sslmode=disable is fine: traffic never leaves the cluster (headless Service,
  # no Ingress). The password below MUST equal POSTGRES_PASSWORD above.
  DSN: "postgres://contentremixer:REPLACE_ME_WITH_A_RANDOM_PASSWORD@pgvector.contentremixer.svc:5432/contentremixer?sslmode=disable"
