# postgres_exporter monitoring credentials — SHAPE ONLY (O11y-4 security pass,
# ISI-7161). Placeholder values, NEVER real secrets, NEVER applied as-is
# (gitleaks scans this path — keep the values as obvious placeholders).
#
# Least privilege: the exporter uses a DEDICATED read-only role, NOT the
# operator's schema-owning app role in pgvector-credentials. The role has
# CONNECT + the built-in `pg_monitor` role (read access to pg_stat_* and
# server stats) and nothing else — it cannot read table data, write, or run DDL.
#
# Create the role out-of-band once, then the Secret (values from your secret
# manager, never the repo). Use a URL-safe (hex) password — it is embedded in
# the DSN URI, so base64 (+ / =) breaks libpq/pgx URI parsing:
#
#   # 1. Create the monitoring role (run as the app/superuser once):
#   EXPPASS="$(openssl rand -hex 24)"
#   psql "$ADMIN_DSN" -v ON_ERROR_STOP=1 <<SQL
#     CREATE ROLE cr_exporter LOGIN PASSWORD '${EXPPASS}';
#     GRANT pg_monitor TO cr_exporter;
#   SQL
#
#   # 2. Create the Secret the exporter reads (sslmode=disable — in-cluster only,
#   #    headless Service, never leaves the cluster):
#   kubectl -n contentremixer create secret generic postgres-exporter-credentials \
#     --from-literal=DSN="postgres://cr_exporter:${EXPPASS}@pgvector.contentremixer.svc:5432/contentremixer?sslmode=disable"
#
# (Phase-1 secrets decision #4 — plain Secret for the test tier; promote to
# sealed-secrets / ExternalSecrets for prod with NO manifest change.)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-exporter-credentials
  namespace: contentremixer
  labels:
    app.kubernetes.io/part-of: contentremixer
type: Opaque
stringData:
  # cr_exporter has pg_monitor only — read-only server/stat visibility, no data.
  DSN: "postgres://cr_exporter:REPLACE_ME_WITH_A_URL_SAFE_RANDOM_PASSWORD@pgvector.contentremixer.svc:5432/contentremixer?sslmode=disable"
