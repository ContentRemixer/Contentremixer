# Per-repo ReferenceRepo template (ISI-7137). Which content repo the operator
# watches is ONE install-time parameter:
#
#   TARGET_REPO = "owner/name"   (e.g. "ContentRemixer/contentmixer-data")
#
# Substitute $TARGET_REPO in spec.repo below and name the CR after the repo
# (a DNS-1123 label derived from the repo name, e.g. repo
# "ContentRemixer/contentmixer-data" -> "contentmixer-data-crate"). spec.repo is
# the single authoritative place "owner/name" is set; nothing else bakes it in.
#
# Routes follow design §3 (board decision #10): inputFormat: auto everywhere;
# Admins only specify output intent. spec.owner is intentionally empty
# (platform/Admin-owned, Phase-1 default). SHAPE ONLY — placeholder values,
# never applied as-is (design §8).
apiVersion: contentremixer.io/v1alpha1
kind: ReferenceRepo
metadata:
  name: contentmixer-data-crate   # derive from $TARGET_REPO's name
  namespace: contentremixer
spec:
  repo: $TARGET_REPO
  tokenRef:
    name: github-pat
    key: token
  webhookSecretRef:
    name: github-webhook
    key: hmac
  prTarget:
    baseBranch: main
    branchPrefix: recycle/
    draft: true
  labelRoutes:
    - label: "recycle:blog"
      inputFormat: auto
      outputFormat: blog
    - label: "recycle:short"
      inputFormat: auto
      outputFormat: short
    - label: "recycle:tutorial"
      inputFormat: auto
      outputFormat: tutorial
    - label: "recycle:teleprompter"
      inputFormat: auto
      outputFormat: teleprompter
