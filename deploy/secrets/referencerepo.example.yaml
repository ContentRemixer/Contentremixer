# Phase-1 starter ReferenceRepo example — design §3 routes (board decision
# #10): inputFormat: auto everywhere; Admins only specify output intent.
# spec.owner is intentionally empty (platform/Admin-owned, Phase-1 default).
apiVersion: contentremixer.io/v1alpha1
kind: ReferenceRepo
metadata:
  name: contentremixer-crate
  namespace: contentremixer
spec:
  repo: ContentRemixer/Contentremixer
  tokenRef:
    name: github-pat
    key: token
  webhookSecretRef:
    name: github-webhook
    key: hmac
  prTarget:
    baseBranch: main
    branchPrefix: recycle/
    draft: true
  labelRoutes:
    - label: "recycle:blog"
      inputFormat: auto
      outputFormat: blog
    - label: "recycle:short"
      inputFormat: auto
      outputFormat: short
    - label: "recycle:tutorial"
      inputFormat: auto
      outputFormat: tutorial
    - label: "recycle:teleprompter"
      inputFormat: auto
      outputFormat: teleprompter
