# TLS Ingress for GitHub webhook deliveries (design §7). Host + issuer are
# finalised by subtask I (ProxOps) for the k8Squad test cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: github-webhook
  namespace: contentremixer
  annotations:
    cert-manager.io/cluster-issuer: placeholder-issuer # subtask I
  labels:
    app.kubernetes.io/name: contentremixer-operator
    app.kubernetes.io/part-of: contentremixer
spec:
  ingressClassName: nginx # adjust per cluster (subtask I)
  tls:
    - hosts:
        - recycler.example.homelab # placeholder — subtask I sets the real host
      secretName: github-webhook-tls
  rules:
    - host: recycler.example.homelab
      http:
        paths:
          - path: /github/webhook
            pathType: Prefix
            backend:
              service:
                name: operator-webhook
                port:
                  number: 8443
