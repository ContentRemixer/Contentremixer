<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif">
  <style>
    .bg{fill:#0f172a}.card{fill:#1e293b}.border{stroke:#334155;stroke-width:1}
    .h{fill:#f1f5f9}.t{fill:#e2e8f0}.m{fill:#94a3b8}.hd{fill:#64748b}
    .input{fill:#0f172a;stroke:#334155;stroke-width:1}
    .sel{fill:#0f172a;stroke:#334155;stroke-width:1}
    .badgeS{fill:#14532d}.badgeStx{fill:#86efac}
    .rowSel{fill:#273449}
    .btn{fill:#334155}.btntx{fill:#e2e8f0}
    .accent{fill:#6366f1}.accenttx{fill:#ffffff}
    .ghost{fill:none;stroke:#334155;stroke-width:1}
    .arrow{stroke:#6366f1;stroke-width:1.5;fill:none;marker-end:url(#a)}
    text{font-size:13px}.hdr{font-size:11px;letter-spacing:.06em}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#6366f1"/></marker></defs>
  <rect class="bg" width="880" height="620"/>
  <!-- tabs -->
  <text class="m" x="24" y="30" font-size="12">… Model profiles</text>
  <text class="m" x="150" y="30" font-size="12">Agents</text>
  <text class="h" x="212" y="30" font-size="12" font-weight="600">Orchestration</text>
  <rect class="accent" x="210" y="38" width="86" height="2"/>
  <line class="border" x1="24" y1="40" x2="856" y2="40"/>

  <!-- LEFT: team list -->
  <rect class="card border" x="24" y="56" width="300" height="540" rx="8"/>
  <text class="h" x="40" y="84" font-size="14" font-weight="600">Agent teams</text>
  <rect class="accent" x="256" y="68" width="56" height="26" rx="6"/>
  <text class="accenttx" x="262" y="85" font-size="11">New team</text>
  <line class="border" x1="40" y1="100" x2="308" y2="100"/>
  <!-- selected row -->
  <rect class="rowSel" x="32" y="110" width="284" height="44" rx="6"/>
  <text class="t" x="44" y="130" font-weight="600">tutorial-default</text>
  <rect class="badgeS" x="200" y="118" width="56" height="16" rx="4"/><text class="badgeStx" x="206" y="130" font-size="10">Default</text>
  <text class="m" x="44" y="146" font-size="11">entry architect · 5 nodes · 4 handoffs</text>
  <!-- row 2 -->
  <text class="t" x="44" y="182">content-default</text>
  <text class="m" x="44" y="198" font-size="11">entry writer · 1 node · 0 handoffs</text>
  <line class="border" x1="40" y1="212" x2="308" y2="212"/>
  <text class="hd" x="40" y="236" font-size="11">Exactly one team may be the</text>
  <text class="hd" x="40" y="252" font-size="11">Default. Seeded teams can't be</text>
  <text class="hd" x="40" y="268" font-size="11">deleted.</text>

  <!-- RIGHT: team editor -->
  <rect class="card border" x="340" y="56" width="516" height="540" rx="8"/>
  <text class="h" x="358" y="84" font-size="14" font-weight="600">Editing: tutorial-default</text>

  <!-- entry -->
  <text class="hd hdr" x="358" y="112">ENTRY</text>
  <rect class="sel" x="358" y="120" width="180" height="32" rx="6"/>
  <text class="t" x="370" y="141">architect</text><text class="m" x="518" y="141">▾</text>

  <!-- nodes -->
  <text class="hd hdr" x="358" y="182">NODES</text>
  <!-- header -->
  <text class="hd" x="358" y="202" font-size="10">node id</text>
  <text class="hd" x="470" y="202" font-size="10">agent</text>
  <!-- node rows -->
  <g>
    <rect class="input" x="358" y="210" width="100" height="30" rx="6"/><text class="t" x="368" y="230" font-size="12">architect</text>
    <rect class="sel" x="466" y="210" width="260" height="30" rx="6"/><text class="t" x="476" y="230" font-size="12">System Architect — architect</text><text class="m" x="706" y="230">▾</text>
    <text class="m" x="738" y="230" font-size="11">Remove</text>
  </g>
  <g transform="translate(0,38)">
    <rect class="input" x="358" y="210" width="100" height="30" rx="6"/><text class="t" x="368" y="230" font-size="12">coding</text>
    <rect class="sel" x="466" y="210" width="260" height="30" rx="6"/><text class="t" x="476" y="230" font-size="12">Coding Specialist — coding</text><text class="m" x="706" y="230">▾</text>
    <text class="m" x="738" y="230" font-size="11">Remove</text>
  </g>
  <g transform="translate(0,76)">
    <rect class="input" x="358" y="210" width="100" height="30" rx="6"/><text class="t" x="368" y="230" font-size="12">graphic</text>
    <rect class="sel" x="466" y="210" width="260" height="30" rx="6"/><text class="t" x="476" y="230" font-size="12">Graphic Designer — graphic</text><text class="m" x="706" y="230">▾</text>
    <text class="m" x="738" y="230" font-size="11">Remove</text>
  </g>
  <text class="m" x="358" y="338" font-size="11">+ Add node</text>

  <!-- handoffs -->
  <text class="hd hdr" x="358" y="378">HANDOFFS (EDGES)</text>
  <g>
    <rect class="sel" x="358" y="388" width="150" height="30" rx="6"/><text class="t" x="368" y="408" font-size="12">architect</text><text class="m" x="490" y="408">▾</text>
    <text class="accenttx" x="518" y="408" fill="#6366f1">→</text>
    <rect class="sel" x="538" y="388" width="150" height="30" rx="6"/><text class="t" x="548" y="408" font-size="12">coding</text><text class="m" x="670" y="408">▾</text>
    <text class="m" x="700" y="408" font-size="11">Remove</text>
  </g>
  <g transform="translate(0,38)">
    <rect class="sel" x="358" y="388" width="150" height="30" rx="6"/><text class="t" x="368" y="408" font-size="12">architect</text><text class="m" x="490" y="408">▾</text>
    <text x="518" y="408" fill="#6366f1">→</text>
    <rect class="sel" x="538" y="388" width="150" height="30" rx="6"/><text class="t" x="548" y="408" font-size="12">graphic</text><text class="m" x="670" y="408">▾</text>
    <text class="m" x="700" y="408" font-size="11">Remove</text>
  </g>
  <text class="m" x="358" y="478" font-size="11">+ Add handoff</text>

  <!-- footer -->
  <line class="border" x1="358" y1="500" x2="838" y2="500"/>
  <text class="badgeStx" x="358" y="528" font-size="12">✓ valid DAG — entry reachable, no cycles</text>
  <rect class="ghost" x="672" y="512" width="74" height="30" rx="6"/><text class="t" x="692" y="532" font-size="12">Cancel</text>
  <rect class="accent" x="758" y="512" width="80" height="30" rx="6"/><text class="accenttx" x="784" y="532" font-size="12">Save</text>

  <text class="hd" x="358" y="572" font-size="11">GET → swap spec.{entry,nodes,edges} → PUT /v1/agentteams · default &amp; owner preserved</text>
</svg>
